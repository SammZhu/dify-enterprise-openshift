---
- name: Read historical completion markers without modifying private state
  hosts: jump
  gather_facts: false
  tasks:
    - name: Find historical stage markers without reading credentials
      ansible.builtin.find:
        paths: "{{ item.root }}/stages"
        patterns: '*.json'
        recurse: false
      delegate_to: "{{ item.host }}"
      loop:
        - {side: jump, root: "{{ rhdp_dify_work_dir }}", host: "{{ inventory_hostname }}"}
        - {side: highside, root: "{{ rhdp_dify_remote_dir }}", host: "{{ rhdp_highside_host }}"}
      register: rhdp_status

    - name: Show only completed phase names
      ansible.builtin.debug:
        msg: "{{ item.item.side }}: {{ item.files | map(attribute='path') | map('basename') | list | sort }}. Historical markers do not prove current readiness."
      loop: "{{ rhdp_status.results }}"
      loop_control:
        label: "{{ item.item.side }}"
