---
- name: Validate the selected phase order
  ansible.builtin.assert:
    that:
      - customer_stages | length > 0
      - customer_stages == customer_all_stages | select('in', customer_stages) | list
      - customer_stages | unique | length == customer_stages | length
      - "'preflight' in customer_stages"
    fail_msg: Select an ordered subset beginning with preflight.
    quiet: true

- name: Build the local configuration without probing a cluster or cloud provider
  ansible.builtin.set_fact:
    customer_config:
      source_dir: "{{ customer_source_dir }}"
      media_root: "{{ customer_media_root }}"
      state_root: "{{ customer_state_root }}"
      bundle_dir: "{{ customer_bundle_dir }}"
      source_authfile: "{{ customer_source_authfile }}"
      ocp_version: "{{ customer_ocp_version }}"
      apps_domain: "{{ customer_apps_domain }}"
      registry_host: "{{ customer_registry_host }}"
      registry_port: "{{ customer_registry_port | int }}"
      wheel_port: "{{ customer_wheel_port | int }}"
      s3_port: "{{ customer_s3_port | int }}"
      storage_class: "{{ customer_storage_class }}"
      values_overlay: "{{ customer_values_overlay }}"
      plugins_dir: "{{ customer_plugins_dir }}"
      wheels_dir: "{{ customer_wheels_dir }}"
      kubeconfig: "{{ customer_kubeconfig }}"
      context: "{{ customer_context }}"
      tls_cert: "{{ customer_tls_cert }}"
      tls_key: "{{ customer_tls_key }}"
      tls_ca: "{{ customer_tls_ca }}"
    customer_run_id: "{{ lookup('password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
  no_log: true

- name: Display the planned stages
  ansible.builtin.debug:
    msg: "Customer {{ customer_mode }} phases: {{ customer_stages | join(', ') }}. --check validates the plan only."

- name: Execute the customer workflow under an exclusive run lease
  when: not ansible_check_mode
  block:
    - name: Acquire a local run lease
      customer_phase:
        mode: "{{ customer_mode }}"
        operation: acquire
        config: "{{ customer_config }}"
        run_id: "{{ customer_run_id }}"
      register: customer_lease
      no_log: true

    - name: Execute selected stages in order
      ansible.builtin.include_tasks: customer-stage.yml
      loop: "{{ customer_stages }}"
      loop_control:
        loop_var: customer_stage
  always:
    - name: Release this run's lease
      customer_phase:
        mode: "{{ customer_mode }}"
        operation: release
        config: "{{ customer_config }}"
        run_id: "{{ customer_run_id }}"
      when: customer_lease is defined and customer_lease is succeeded
      no_log: true
