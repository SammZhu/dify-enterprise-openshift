---
- name: Create private public-source snapshot directories
  ansible.builtin.file:
    path: "{{ rhdp_settings.workDir }}/source/{{ item }}"
    state: directory
    mode: '0700'
  loop: ['', scripts]

- name: Copy the delivered public dependency directories without Git metadata
  ansible.builtin.copy:
    src: "{{ rhdp_source_dir }}/{{ item }}"
    dest: "{{ rhdp_settings.workDir }}/source/"
    remote_src: true
    mode: preserve
  loop: [examples, offline, docs, README.md]
  when: rhdp_source_dir != rhdp_settings.workDir + '/source'

- name: Copy the three public delivery helpers
  ansible.builtin.copy:
    src: "{{ rhdp_source_dir }}/scripts/{{ item }}"
    dest: "{{ rhdp_settings.workDir }}/source/scripts/{{ item }}"
    remote_src: true
    mode: '0700'
  loop: [offline.py, offline-post-render.sh, start-offline-services.sh]
  when: rhdp_source_dir != rhdp_settings.workDir + '/source'

- name: Transfer this source whitelist to Highside without source authentication
  ansible.builtin.command:
    argv:
      - rsync
      - -a
      - --partial
      - --itemize-changes
      - -e
      - ssh -o BatchMode=yes -o ConnectTimeout=20
      - "{{ rhdp_settings.workDir }}/source"
      - "{{ rhdp_rsync_target }}:{{ rhdp_settings.remoteDir }}/"
  register: rhdp_source_sync
  changed_when: rhdp_source_sync.stdout | length > 0
  no_log: true
