---
- name: "Customer {{ customer_mode }} | {{ customer_stage }}"
  customer_phase:
    mode: "{{ customer_mode }}"
    stage: "{{ customer_stage }}"
    config: "{{ customer_config }}"
    run_id: "{{ customer_run_id }}"
  async: "{{ customer_phase_timeout }}"
  poll: 20
  no_log: true

- name: Install boot recovery after verifying container ownership
  ansible.builtin.include_tasks: services-autostart.yml
  vars:
    dify_service_host: localhost
    dify_service_state: "{{ customer_state_root }}/state"
    dify_service_bundle: "{{ customer_bundle_dir }}"
  when: customer_mode == 'install' and customer_stage == 'services'

- name: "Completed customer {{ customer_stage }}"
  ansible.builtin.debug:
    msg: "Completed {{ customer_stage }}; command output remains in private on-host logs."
