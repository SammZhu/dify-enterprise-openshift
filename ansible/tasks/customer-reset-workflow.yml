---
- name: Build the explicit target configuration
  ansible.builtin.set_fact:
    customer_reset_config:
      bundle_dir: "{{ customer_bundle_dir }}"
      state_root: "{{ customer_state_root }}"
      kubeconfig: "{{ customer_kubeconfig }}"
      context: "{{ customer_context }}"
    reset_run_id: "{{ customer_reset_run_id if customer_reset_run_id | length else lookup('password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
  no_log: true

- name: Read and validate the live reset plan without changing resources
  customer_reset:
    action: plan
    mode: "{{ customer_reset_mode }}"
    config: "{{ customer_reset_config }}"
    run_id: "{{ reset_run_id }}"
    resume: "{{ customer_reset_resume }}"
  register: reset_preview
  check_mode: false

- name: Show the deletion scope and confirmation hash
  ansible.builtin.debug:
    msg:
      mode: "{{ reset_preview.plan.mode }}"
      cluster_id: "{{ reset_preview.plan.identity.clusterID }}"
      context: "{{ reset_preview.plan.identity.context }}"
      namespace: dify
      namespace_uid: "{{ reset_preview.plan.namespaceUID }}"
      objects: "{{ reset_preview.plan.objects }}"
      pv_reclaim_policies: "{{ reset_preview.plan.volumes }}"
      host_data: "{{ reset_preview.plan.directories }}"
      owned_containers: "{{ reset_preview.plan.containers }}"
      confirmation: "{{ reset_preview.plan.confirmation }}"
      run_id: "{{ reset_run_id }}"
      retained: 'Sealed media, CA/credentials, cluster resources, Podman image cache and original Workshop mirror-registry.'
      next: 'Default is preview only. Execution requires customer_reset_execute=true and the reviewed customer_reset_confirm hash.'

- name: Execute only an explicitly confirmed reset
  when: customer_reset_execute | bool and not ansible_check_mode
  block:
    - name: Require the exact reviewed plan confirmation
      ansible.builtin.assert:
        that: customer_reset_confirm == reset_preview.plan.confirmation
        quiet: true
        fail_msg: Copy the confirmation hash from a fresh preview of this mode and target.

    - name: Acquire the same state lease as the installer
      customer_reset:
        action: acquire
        mode: "{{ customer_reset_mode }}"
        config: "{{ customer_reset_config }}"
        run_id: "{{ reset_run_id }}"
      register: reset_lease
      no_log: true

    - name: Record the confirmed plan or validate the resumed run
      customer_reset:
        action: begin
        mode: "{{ customer_reset_mode }}"
        config: "{{ customer_reset_config }}"
        run_id: "{{ reset_run_id }}"
        plan: "{{ reset_preview.plan }}"
        confirmation: "{{ customer_reset_confirm }}"
        resume: "{{ customer_reset_resume }}"
      no_log: true

    - name: Remove the verified namespace and wait for deletion
      ansible.builtin.include_tasks: customer-reset-phase.yml
      vars:
        reset_action: namespace

    - name: Revalidate ownership before changing the host unit
      ansible.builtin.include_tasks: customer-reset-phase.yml
      vars:
        reset_action: validate

    - name: Check whether the verified boot unit remains present
      ansible.builtin.stat:
        path: /etc/systemd/system/dify-offline-services.service
      register: reset_boot_unit

    - name: Disable and stop the owned boot unit for a full reset
      ansible.builtin.systemd_service:
        name: dify-offline-services.service
        enabled: false
        state: stopped
      become: true
      when: customer_reset_mode == 'full' and reset_boot_unit.stat.exists

    - name: Remove only the owned unit file
      ansible.builtin.file:
        path: /etc/systemd/system/dify-offline-services.service
        state: absent
      become: true
      when: customer_reset_mode == 'full'

    - name: Reload systemd after removing the dedicated unit
      ansible.builtin.systemd_service:
        daemon_reload: true
      become: true
      when: customer_reset_mode == 'full'

    - name: Reset selected host data and services
      ansible.builtin.include_tasks: customer-reset-phase.yml
      vars:
        reset_action: host-data

    - name: Remove stale acceptance markers and write the reset report
      ansible.builtin.include_tasks: customer-reset-phase.yml
      vars:
        reset_action: finish

    - name: Show reset completion and the reinstall entry
      ansible.builtin.debug:
        msg: "Reset {{ reset_run_id }} complete: {{ customer_state_root }}/reset-report.json. Reinstall and accept using customer-install.yml or the RHDP dify.yml workflow."
  always:
    - name: Release only this reset run's lease
      customer_reset:
        action: release
        mode: "{{ customer_reset_mode }}"
        config: "{{ customer_reset_config }}"
        run_id: "{{ reset_run_id }}"
      when: reset_lease is defined and reset_lease is succeeded
      no_log: true
