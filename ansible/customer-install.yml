---
- name: Customer offline Dify install
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars_files: [customer-defaults.yml]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Run the provider-independent customer workflow
      ansible.builtin.include_role:
        name: dify_offline
      vars:
        customer_mode: install
        customer_stages: "{{ customer_install_stages }}"
        customer_all_stages: [preflight, verify, services, import, install, check]
