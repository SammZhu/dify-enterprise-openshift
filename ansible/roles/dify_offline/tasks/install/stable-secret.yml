---
- name: Read an existing stable application Secret
  ansible.builtin.command:
    argv: "{{ dify_oc + ['get', 'secret', dify_stable_secret.name, '-n', 'dify', '--ignore-not-found', '-o', 'json'] }}"
  register: dify_existing_secret
  changed_when: false
  no_log: true

- name: Require complete keys in retained application Secrets
  ansible.builtin.assert:
    that: dify_stable_secret['keys'] | difference((dify_existing_secret.stdout | from_json).data.keys() | list) | length == 0
    quiet: true
  when: dify_existing_secret.stdout | length > 0
  no_log: true

- name: Allocate initial stable Secret content
  ansible.builtin.set_fact:
    dify_new_secret_data: {}
  when: dify_existing_secret.stdout | length == 0
  no_log: true

- name: Generate new application keys or reuse host S3 credentials
  ansible.builtin.set_fact:
    dify_new_secret_data: "{{ dify_new_secret_data | combine({dify_credential_field: (dify_s3_identity[dify_credential_field] if dify_stable_secret.name == 'dify-local-s3' else lookup('password', '/dev/null', length=56, chars=['ascii_letters', 'digits'])) | b64encode}) }}"
  loop: "{{ dify_stable_secret['keys'] }}"
  loop_control:
    loop_var: dify_credential_field
  when: dify_existing_secret.stdout | length == 0
  no_log: true

- name: Create missing stable Secret without rotating existing values
  ansible.builtin.include_tasks: "{{ dify_tasks_dir }}/apply.yml"
  vars:
    dify_apply_resource:
      apiVersion: v1
      kind: Secret
      metadata: {name: "{{ dify_stable_secret.name }}", namespace: dify}
      data: "{{ dify_new_secret_data }}"
  when: dify_existing_secret.stdout | length == 0
