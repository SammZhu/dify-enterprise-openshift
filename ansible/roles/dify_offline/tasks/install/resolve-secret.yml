---
- name: Read one explicitly referenced Secret
  ansible.builtin.command:
    argv: "{{ dify_oc + ['get', 'secret', dify_secret_reference[0], '-n', 'dify', '-o', 'json'] }}"
  register: dify_referenced_secret
  changed_when: false
  no_log: true

- name: Require the referenced key
  ansible.builtin.assert:
    that: dify_secret_reference[1] in (dify_referenced_secret.stdout | from_json).data
    quiet: true
  no_log: true

- name: Replace the reference in structured values without YAML injection
  ansible.builtin.set_fact:
    dify_values_text: "{{ dify_values_text | replace('@@secret:' + dify_secret_reference[0] + '/' + dify_secret_reference[1] + '@@', (((dify_referenced_secret.stdout | from_json).data[dify_secret_reference[1]] | b64decode) | to_json)[1:-1]) }}"
  no_log: true
