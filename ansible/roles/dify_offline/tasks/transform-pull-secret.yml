---
- name: Authenticate direct Pods and ServiceAccounts
  ansible.builtin.set_fact:
    dify_resource: "{{ dify_resource | combine({'imagePullSecrets': (dify_resource.imagePullSecrets | default([]) + [{'name': 'offline-registry-pull'}]) | unique} if dify_resource.kind == 'ServiceAccount' else {'spec': {'imagePullSecrets': (dify_resource.spec.imagePullSecrets | default([]) + [{'name': 'offline-registry-pull'}]) | unique}}, recursive=true) }}"
  when: dify_resource.kind in ['Pod', 'ServiceAccount']
  no_log: true

- name: Authenticate Deployment, StatefulSet, DaemonSet, ReplicaSet and Job Pods
  ansible.builtin.set_fact:
    dify_resource: "{{ dify_resource | combine({'spec': {'template': {'spec': {'imagePullSecrets': (dify_resource.spec.template.spec.imagePullSecrets | default([]) + [{'name': 'offline-registry-pull'}]) | unique}}}}, recursive=true) }}"
  when: dify_resource.kind in ['Deployment', 'StatefulSet', 'DaemonSet', 'ReplicaSet', 'Job']
  no_log: true

- name: Authenticate scheduled Job Pods
  ansible.builtin.set_fact:
    dify_resource: "{{ dify_resource | combine({'spec': {'jobTemplate': {'spec': {'template': {'spec': {'imagePullSecrets': (dify_resource.spec.jobTemplate.spec.template.spec.imagePullSecrets | default([]) + [{'name': 'offline-registry-pull'}]) | unique}}}}}}, recursive=true) }}"
  when: dify_resource.kind == 'CronJob'
  no_log: true
