---
- name: Decode textual Secret data for known image substitutions
  ansible.builtin.set_fact:
    dify_text: "{{ dify_secret_field.value | b64decode }}"
  no_log: true

- name: Substitute runtime images inside decoded plugin configuration
  ansible.builtin.include_tasks: "{{ dify_tasks_dir }}/map-text.yml"
  when: dify_text | regex_search('[\ud800-\udfff]') is none

- name: Re-encode mapped Secret data
  ansible.builtin.set_fact:
    dify_resource: "{{ dify_resource | combine({'data': {dify_secret_field.key: dify_text | b64encode}}, recursive=true) }}"
  no_log: true
  when: dify_text | regex_search('[\ud800-\udfff]') is none
