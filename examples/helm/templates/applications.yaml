# =============================================================================
# App of Apps - one ArgoCD Application per component
# =============================================================================
# Sync waves order the rollout:
#   0  prereqs    - SCC bindings / ServiceAccount / RBAC must exist first
#   1  data tier  - PostgreSQL, Redis, Qdrant, object storage (MCG)
#   2  dify       - Dify Enterprise itself
#   3  tracing    - optional: Tempo + a platform-owned OTel collector
#   3  logging    - optional: LokiStack + a least-privilege log forwarder
# =============================================================================

{{- $common := dict "repoURL" .Values.gitops.repoUrl "revision" .Values.gitops.revision "base" .Values.gitops.basePath "argons" .Values.argocd.namespace "project" .Values.argocd.project "ns" .Values.namespace }}

{{- if .Values.components.prereqs.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-prereqs
  namespace: {{ $common.argons }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $common.project }}
  source:
    repoURL: {{ $common.repoURL }}
    targetRevision: {{ $common.revision }}
    path: {{ $common.base }}/components/dify-prereqs
    helm:
      valuesObject:
        prereqs:
          enabled: {{ .Values.components.prereqs.enabled }}
          namespace: {{ $common.ns }}
          serviceAccountName: {{ .Values.components.prereqs.serviceAccountName }}
          scc: {{ .Values.components.prereqs.scc }}
          privilegedForPluginBuild: {{ .Values.components.prereqs.privilegedForPluginBuild }}
          pluginCrdAccess:
            enabled: {{ .Values.components.prereqs.pluginCrdAccess.enabled }}
            apiGroup: {{ .Values.components.prereqs.pluginCrdAccess.apiGroup }}
          userAccess:
            enabled: {{ .Values.components.prereqs.userAccess.enabled }}
            prefix: {{ .Values.components.prereqs.userAccess.prefix }}
            role: {{ .Values.components.prereqs.userAccess.role }}
            allowRoleCreation: {{ .Values.components.prereqs.userAccess.allowRoleCreation }}
            count: {{ .Values.user.count }}
          imageBuilder:
            enabled: {{ .Values.components.prereqs.imageBuilder.enabled }}
          sandboxScc:
            enabled: {{ .Values.components.prereqs.sandboxScc.enabled }}
            name: {{ .Values.components.prereqs.sandboxScc.name }}
          sccMatrix:
{{ toYaml .Values.components.prereqs.sccMatrix | indent 12 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $common.ns }}
  syncPolicy:
    automated:
      # collaborationMode keeps ArgoCD from reverting hand-made changes while
      # Dify engineers are deploying interactively. See values.yaml.
      prune: {{ not $.Values.collaborationMode }}
      selfHeal: {{ not $.Values.collaborationMode }}
    syncOptions:
      - CreateNamespace=true
{{- end }}

{{- if .Values.components.pluginCrds.enabled }}
---
# The plugin CRD, installed by ArgoCD rather than by hand.
#
# sync-wave 0: the CRD must exist before anything creates a DifyPlugin, and
# before the RBAC in dify-prereqs that grants access to those resources.
#
# The CRD is only an API schema - no code, no credentials - so unlike the rest
# of the commercial chart it can live in this public repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-plugin-crds
  namespace: {{ $common.argons }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $common.project }}
  source:
    repoURL: {{ $common.repoURL }}
    targetRevision: {{ $common.revision }}
    path: {{ $common.base }}/components/plugin-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $common.ns }}
  syncPolicy:
    automated:
      # Never prune a CRD: deleting it cascade-deletes every DifyPlugin
      # resource. This stays false even outside collaboration mode.
      prune: false
      selfHeal: {{ not $.Values.collaborationMode }}
    syncOptions:
      - CreateNamespace=true
{{- end }}

