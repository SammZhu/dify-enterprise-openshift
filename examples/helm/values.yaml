# =============================================================================
# Dify Enterprise on OpenShift - App of Apps
# =============================================================================
# Target: Dify Enterprise v3.9.8 (Red Hat Partner Validated on OCP 4.20 / 4.21)
# Catalog: https://catalog.redhat.com/en/software/container-stacks/detail/69fc3bfc14f7cd2916ffd595
#
# This chart deploys the EXTERNAL dependencies Dify Enterprise requires but does
# not ship, plus the OpenShift-specific glue (SCC, RBAC, Routes). The Dify
# Enterprise chart itself is a commercial artifact - see components.dify below.
# =============================================================================

gitops:
  repoUrl: "https://github.com/SammZhu/dify-enterprise-openshift.git"
  revision: "main"
  basePath: "examples/helm"

argocd:
  namespace: openshift-gitops
  # The field-content workload overrides this to "deployed"
  project: default

# Namespace everything lands in
namespace: dify

# -----------------------------------------------------------------------------
# Collaboration mode
# -----------------------------------------------------------------------------
# true  - ArgoCD installs the components once, then leaves the cluster alone
#         (selfHeal and prune off). Use this while people are deploying and
#         troubleshooting by hand: otherwise ArgoCD reverts their changes a few
#         minutes later, which is maddening to debug.
# false - Normal GitOps. Git is the source of truth and drift is corrected.
#         Switch to this once the deployment is captured back into this repo.
collaborationMode: true

components:

  # --- OpenShift prerequisites: SCC bindings, ServiceAccount, RBAC ----------
  # Dify Enterprise docs: "If you are using a restricted environment, please make
  # sure to allow the pods to run as root (like OpenShift)."
  # License activation additionally requires a ServiceAccount + Role/RoleBinding.
  prereqs:
    enabled: true
    serviceAccountName: dify
    # anyuid is enough for the Dify workloads themselves.
    scc: anyuid
    # The plugin build path runs Kaniko in-cluster. If plugin builds fail with
    # permission errors, flip this to true to also bind privileged.
    privilegedForPluginBuild: false
    # Namespace access for the RHDP-provisioned users. count defaults to the
    # injected user.count, so it matches whatever was ordered.
    userAccess:
      enabled: true
      prefix: user
      role: admin
      allowRoleCreation: true
    # Least-privilege SCC for the sandbox: SYS_CHROOT only, not privileged.
    # Push rights to the internal registry for the Kaniko plugin build.
    imageBuilder:
      enabled: true
    sandboxScc:
      enabled: true
      name: dify-sandbox
    # Components that should get a tighter SCC than the anyuid baseline.
    sccMatrix:
      enabled: true
      # Must outrank anyuid (priority 10) or it is never selected.
      nonrootSccName: dify-nonroot
      nonrootPriority: 20
      nonrootServiceAccounts:
        - dify-dify-enterprise-plugin-connector-sa
    # DifyPlugin CRs. The CRD is installed out of band; its resources are
    # Namespaced, so no cluster-level grant is involved.
    pluginCrdAccess:
      enabled: true
      apiGroup: enterprise.dify.ai

  # --- Distributed tracing ------------------------------------------------
  # Tempo + a platform-owned OpenTelemetry collector + the console's Traces
  # page. On by default: it is part of what this deployment demonstrates.
  # It installs three cluster-level operators - set enabled: false on a
  # cluster that already runs its own tracing stack.
  # Point Dify's 数据推送 at:
  #   http://dify-otel-collector.<namespace>.svc.cluster.local:4318
  tracing:
    enabled: true
    namespace: dify-observability
    installOperators: true
    tempo:
      name: dify-traces
      size: 10Gi
      memoryLimit: 2Gi
      tenantName: dify
      tenantId: 4f1f0f5a-9c1e-4c55-9d7a-3b6f2a8e1d01
    collector:
      name: dify-otel

  # --- Logging ----------------------------------------------------------------
  # LokiStack on ODF object storage + a forwarder that may read only application
  # logs of the namespaces below. On by default, like tracing. It installs two
  # cluster-level operators - set enabled: false on a cluster that already
  # runs OpenShift Logging. Its console page (Observe -> Logs) needs the
  # Cluster Observability Operator, which the tracing component installs.
  logging:
    enabled: true
    namespace: openshift-logging
    installOperators: true
    channel: stable-6.6
    size: 1x.pico
    storageClassName: ocs-external-storagecluster-ceph-rbd
    bucketName: loki-dify-logs
    namespaces: [dify, dify-observability]
    cliImage: quay.io/openshift/origin-cli:latest

  # --- Plugin CRD ----------------------------------------------------------
  # The DifyPlugin CRD. Not part of the certified image set - it ships as a
  # separate chart - but it is only an API schema, so it can be version
  # controlled here and installed by GitOps rather than by hand.
  pluginCrds:
    enabled: true

  # --- PostgreSQL 14+ (Dify requirement) -----------------------------------
  postgresql:
    enabled: true
    fsGroup: 26
    image: quay.io/sclorg/postgresql-16-c9s:latest
    database: dify
    username: dify
    storage:
      size: 30Gi
      storageClassName: ""
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "2",    memory: "4Gi" }

  # --- Redis 6+ (Dify requirement) -----------------------------------------
  redis:
    enabled: true
    fsGroup: 1001
    image: quay.io/sclorg/redis-7-c9s:latest
    storage:
      size: 5Gi
      storageClassName: ""
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "1Gi" }

  # --- Qdrant (the vector DB Dify officially recommends) --------------------
  qdrant:
    enabled: true
    image: docker.io/qdrant/qdrant:v1.12.4
    storage:
      size: 30Gi
      storageClassName: ""
    resources:
      requests: { cpu: "500m", memory: "2Gi" }
      limits:   { cpu: "4",    memory: "8Gi" }

  # --- MinIO: S3-compatible endpoint for Dify persistent storage -----------
  # Swap for real AWS S3 (or ODF) by disabling this and pointing
  # components.dify.storage.* at the external endpoint.
  # --- Object storage (S3) --------------------------------------------------
  # From the platform: an ObjectBucketClaim on ODF's Multicloud Object Gateway.
  # Needs ODF with MCG (storage class openshift-storage.noobaa.io).
  objectStorage:
    enabled: true
    claimName: dify-objectstorage
    storageClassName: openshift-storage.noobaa.io
    bucketName: ""          # empty = dify-<namespace>
    endpoint: http://s3.openshift-storage.svc:80

  # --- MinIO (disabled) -------------------------------------------------------
  # Kept only for clusters without ODF. Its community images are no longer
  # public: quay.io/minio/minio answers `unauthorized`, docker.io/minio/minio
  # `denied` (checked 2026-09-26). Enabling this needs an image you mirror
  # yourself - set `image` and `mcImage` to it - and objectStorage.enabled=false.
  minio:
    enabled: false
    image: quay.io/minio/minio:latest
    mcImage: quay.io/minio/mc:latest
    bucket: dify
    storage:
      size: 50Gi
      storageClassName: ""
    resources:
      requests: { cpu: "200m", memory: "512Mi" }
      limits:   { cpu: "1",    memory: "2Gi" }

  # --- In-cluster embedding model -----------------------------------------
  # A LiteMaaS key serves only the model chosen at order time, so an order for
  # a chat model leaves RAG with no embedder. This fills that gap on CPU.
  # Disable it if you obtain a LiteMaaS key for nomic-embed-text-v1-5 - both
  # are 768 dimensions, so switching does not require reindexing.
  embedder:
    enabled: true
    image: docker.io/ollama/ollama:latest
    model: nomic-embed-text
    dimensions: 768
    storage:
      size: 10Gi
      storageClassName: ""
    resources:
      requests: { cpu: "500m", memory: "2Gi" }
      limits:   { cpu: "4",    memory: "8Gi" }

  # --- Dify Enterprise itself ----------------------------------------------
  # PLACEHOLDER. The dify-enterprise Helm chart is a commercial artifact
  # delivered with your Dify Enterprise contract (License + deployment manual).
  # Until you have chart access this renders only the Secrets and Routes that
  # the Dify chart will consume. See components/dify/values.yaml.
  dify:
    enabled: true
    # Trace sampling for Dify's OpenTelemetry export. The chart's own default is
    # 0.2; 1.0 makes every conversation findable in Observe -> Traces.
    otel:
      samplingRate: "1.0"
    # Set to true once you have the chart repo credentials; see README.
    chartAvailable: false
    chartRepo: ""        # e.g. https://<dify-provided-helm-repo>
    chartName: dify
    chartVersion: ""

    # The 6 hostnames Dify Enterprise requires. Rendered against deployer.domain.
    hosts:
      consolePrefix: dify-console
      apiPrefix: dify-api
      appPrefix: dify-app
      uploadPrefix: dify-upload
      enterprisePrefix: dify-enterprise
      triggerPrefix: dify-trigger

    # Plugin image registry. Dify builds plugin packages into images in-cluster
    # (Kaniko) and pushes them here.
    #   imageRepoType: docker -> Docker Hub or any Docker-compatible registry,
    #                            including the OpenShift internal registry.
    #   imageRepoType: ecr    -> AWS ECR (also set ecrRegion).
    pluginRegistry:
      imageRepoType: docker
      imageRepoPrefix: "image-registry.openshift-image-registry.svc:5000/dify"
      insecureImageRepo: true
      ecrRegion: ""

    # Disable the public marketplace for air-gapped / restricted clusters.
    marketplaceEnabled: true

# =============================================================================
# Values injected by the field content workload (do not modify)
# =============================================================================
deployer:
  domain: ""
  apiUrl: ""

guid: ""

user:
  count: 0

# Base workloads selected at order time
bases:
  virt: false
  rhoai: false
  aap: false

# LiteMaaS / MaaS API key, injected when enabled at order time.
# Available models: gpt-oss-120b, gpt-oss-20b, llama-scout-17b,
#                   nomic-embed-text-v1-5
litemaas:
  apiUrl: ""
  apiKey: ""
  model: ""

fieldContent:
  deploymentType: "helm"
