# Credentials live in cluster-generated secrets, never here.
# See components/dify-prereqs/templates/generate-secrets-job.yaml
redis:
  enabled: true
  namespace: dify
  serviceAccountName: dify
  image: quay.io/sclorg/redis-7-c9s:latest
  storage:
    size: 5Gi
    storageClassName: ""
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "1Gi" }
  # UID the container image runs as; used as fsGroup so the volume is writable.
  fsGroup: 1001
