{{- if .Values.postgresql.enabled }}
---
# Dify Enterprise requires these databases to exist BEFORE first start
# (enterprise-docs.dify.ai -> Advanced Configuration -> External Database):
#   dify, enterprise, audit      <- documented as manual
#   dify_plugin_daemon           <- documented as automatic, but IS NOT.
#
# The plugin daemon tries to create that fourth database itself and dies:
#   FATAL: database "dify_plugin_daemon" does not exist
#   ERROR: permission denied to create database (SQLSTATE 42501)
# The application user has rolcreatedb=false, which the docs do not mention.
# Creating all four here avoids depending on a privilege we would rather not
# grant.
#
# The sclorg PostgreSQL image sources every *.sh in
# /opt/app-root/src/postgresql-start/ once the server is up, which is the
# supported extension point for this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dify-postgresql-init
  namespace: {{ .Values.postgresql.namespace }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
data:
  10-dify-databases.sh: |
    #!/bin/bash
    set -e
    for db in dify enterprise audit dify_plugin_daemon; do
      if psql -tAc "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1; then
        echo "database ${db} already exists"
      else
        echo "creating database ${db}"
        createdb -O "${POSTGRESQL_USER}" "${db}"
      fi
    done
{{- end }}
