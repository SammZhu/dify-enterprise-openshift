{{- if .Values.tracing.installOperators }}
{{- $ops := list
  (dict "ns" "openshift-tempo-operator" "pkg" "tempo-product")
  (dict "ns" "openshift-opentelemetry-operator" "pkg" "opentelemetry-product")
  (dict "ns" "openshift-cluster-observability-operator" "pkg" "cluster-observability-operator") }}
{{- range $ops }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .ns }}
  labels:
    openshift.io/cluster-monitoring: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .ns }}
  namespace: {{ .ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .pkg }}
  namespace: {{ .ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  channel: stable
  name: {{ .pkg }}
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
{{- end }}
{{- end }}
