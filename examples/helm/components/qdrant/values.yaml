# Credentials live in cluster-generated secrets, never here.
# See components/dify-prereqs/templates/generate-secrets-job.yaml
qdrant:
  enabled: true
  namespace: dify
  serviceAccountName: dify
  image: docker.io/qdrant/qdrant:v1.12.4
  storage:
    size: 30Gi
    storageClassName: ""
  resources:
    requests: { cpu: "500m", memory: "2Gi" }
    limits:   { cpu: "4",    memory: "8Gi" }
