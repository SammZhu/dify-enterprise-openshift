{{- if .Values.embedder.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: dify-embedder
  namespace: {{ .Values.embedder.namespace }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
spec:
  selector:
    app: dify-embedder
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dify-embedder
  namespace: {{ .Values.embedder.namespace }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
spec:
  serviceName: dify-embedder
  replicas: 1
  selector:
    matchLabels:
      app: dify-embedder
  template:
    metadata:
      labels:
        app: dify-embedder
        demo.redhat.com/application: "dify-enterprise"
    spec:
      serviceAccountName: {{ .Values.embedder.serviceAccountName }}
      containers:
        - name: ollama
          image: {{ .Values.embedder.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: /models
            # Embedding requests are short; keep the model resident.
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ollama serve &
              SERVER_PID=$!
              echo "waiting for ollama to accept connections..."
              until ollama list >/dev/null 2>&1; do sleep 2; done
              # Idempotent: a model already in the volume is not re-downloaded.
              if ollama list | grep -q '{{ .Values.embedder.model }}'; then
                echo "model {{ .Values.embedder.model }} already present"
              else
                echo "pulling {{ .Values.embedder.model }}..."
                ollama pull {{ .Values.embedder.model }}
              fi
              echo "embedder ready"
              wait $SERVER_PID
          readinessProbe:
            # Ready only once the model is actually loadable - serving before
            # the pull completes would give Dify a working endpoint that
            # returns errors.
            exec:
              command:
                - /bin/sh
                - -c
                - ollama list | grep -q '{{ .Values.embedder.model }}'
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 40
          resources:
{{ toYaml .Values.embedder.resources | indent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.embedder.storage.storageClassName }}
        storageClassName: {{ .Values.embedder.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.embedder.storage.size }}
---
# Connection details for configuring Dify's model provider.
# Dify -> Model Provider -> OpenAI-API-compatible -> Text Embedding
apiVersion: v1
kind: ConfigMap
metadata:
  name: dify-embedder
  namespace: {{ .Values.embedder.namespace }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
data:
  apiUrl: "http://dify-embedder.{{ .Values.embedder.namespace }}.svc.cluster.local:11434/v1"
  model: {{ .Values.embedder.model | quote }}
  dimensions: {{ .Values.embedder.dimensions | quote }}
  # nomic-embed-text expects task prefixes: "search_document: " when indexing,
  # "search_query: " when retrieving. Dify's OpenAI-compatible provider does not
  # add them. Omitting them does not error - retrieval quality just degrades in
  # a way that is hard to trace back here.
  notes: "nomic-embed-text expects search_document:/search_query: prefixes; API key can be any non-empty string"
{{- end }}
