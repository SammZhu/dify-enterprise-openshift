prereqs:
  enabled: true
  namespace: dify
  serviceAccountName: dify
  scc: anyuid
  privilegedForPluginBuild: false
  # Image used by the credential-generation job; needs `oc` on PATH.
  cliImage: quay.io/openshift/origin-cli:latest
  # Non-sensitive values baked into the generated secrets. Passwords, API keys
  # and access keys are generated on the cluster - see generate-secrets-job.yaml.
  secrets:
    postgresqlDatabase: dify
    postgresqlUsername: dify
    minioBucket: dify
  # Grants the RHDP-provisioned users (user1..userN) admin of this namespace,
  # so the Dify engineers can install and troubleshoot without sharing the
  # cluster admin account. Adjust prefix if your users are named differently.
  userAccess:
    enabled: true
    prefix: user
    count: 0
    role: admin
    # The Dify chart creates Roles with verbs:["*"], which RBAC's escalation
    # check refuses unless the installer also holds "*". Namespace-scoped only.
    allowRoleCreation: true
  # Access to the DifyPlugin CRs. The CRD is installed separately (it is not in
  # the certified image set) but its resources are Namespaced, so this needs no
  # cluster-level permission.
  pluginCrdAccess:
    enabled: true
    apiGroup: enterprise.dify.ai
  # Dedicated least-privilege SCC for the sandbox (SYS_CHROOT + privilege
  # escalation, nothing else). Without it the sandbox pod cannot be admitted.
  sandboxScc:
    enabled: true
    name: dify-sandbox
  # Per-component SCC assignment beyond the namespace-wide anyuid baseline.
  # ServiceAccount names are Helm-release derived: <release>-dify-enterprise-*
  sccMatrix:
    enabled: true
    # Must outrank anyuid (priority 10) or it is never selected.
    nonrootSccName: dify-nonroot
    nonrootPriority: 20
    nonrootServiceAccounts:
      - dify-dify-enterprise-plugin-connector-sa
  # Scrape the chart's OpenTelemetry collector with OpenShift's own Prometheus.
  # Inert unless user workload monitoring is enabled cluster-side - see
  # servicemonitor.yaml for the one command that does it.
  monitoring:
    enabled: true
    # Labels on the chart-created collector Service. Chart/app version labels
    # are deliberately not matched on; they change on every upgrade.
    serviceNameLabel: dify-enterprise
    releaseName: dify
    collectorAppLabel: dify-dify-enterprise-enterprise-collector
    portName: http-metrics
    interval: 30s
  # SSO against Red Hat build of Keycloak. OFF by default, because turning it
  # on grants this namespace read access to the RHBK admin credential in
  # another namespace - see sso-keycloak-access.yaml for the full trade-off.
  # With it off, register the clients out-of-band instead:
  #   ./scripts/create-sso-client.sh workspace
  sso:
    enabled: false
    keycloakNamespace: keycloak
    adminSecretName: keycloak-initial-admin
    # Reusing the realm that already backs the cluster's own OAuth means one
    # identity source for the platform and for the application on it.
    realm: sso
    workspaceClientId: dify-enterprise
    dashboardClientId: dify-dashboard
    # Enforce S256 rather than merely accept it, so that switching Dify's PKCE
    # toggle off fails the login instead of quietly weakening it.
    enforcePkceS256: true
  # Push rights to the OpenShift internal registry, needed by the in-cluster
  # Kaniko plugin build. Not required if plugins push to an external registry.
  imageBuilder:
    enabled: true
