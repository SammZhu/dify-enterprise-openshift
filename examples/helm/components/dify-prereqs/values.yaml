prereqs:
  enabled: true
  namespace: dify
  serviceAccountName: dify
  scc: anyuid
  privilegedForPluginBuild: false
  # Image used by the credential-generation job; needs `oc` on PATH.
  cliImage: quay.io/openshift/origin-cli:latest
  # Non-sensitive values baked into the generated secrets. Passwords, API keys
  # and access keys are generated on the cluster - see generate-secrets-job.yaml.
  secrets:
    postgresqlDatabase: dify
    postgresqlUsername: dify
    minioBucket: dify
  # Grants the RHDP-provisioned users (user1..userN) admin of this namespace,
  # so the Dify engineers can install and troubleshoot without sharing the
  # cluster admin account. Adjust prefix if your users are named differently.
  userAccess:
    enabled: true
    prefix: user
    count: 0
    role: admin
  # Access to the DifyPlugin CRs. The CRD is installed separately (it is not in
  # the certified image set) but its resources are Namespaced, so this needs no
  # cluster-level permission.
  pluginCrdAccess:
    enabled: true
    apiGroup: enterprise.dify.ai
