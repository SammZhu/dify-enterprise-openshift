{{- if .Values.prereqs.enabled }}
---
# Dify Enterprise docs, Resources Checklist:
#   "If you are using a restricted environment, please make sure to allow the
#    pods to run as root (like OpenShift)."
# OpenShift ships a ClusterRole per SCC (system:openshift:scc:<name>); binding it
# to a ServiceAccount is the supported way to grant that SCC.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dify-scc-{{ .Values.prereqs.scc }}
  namespace: {{ .Values.prereqs.namespace }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Values.prereqs.scc }}
subjects:
  # Bind to every ServiceAccount in the namespace, not just ours.
  #
  # The Dify chart creates its own ServiceAccounts, named after the Helm
  # release - dify-dify-enterprise-plugin-connector-sa and friends. Binding
  # only `dify` and `default` left those on restricted-v2, and pods that pin a
  # UID were refused outright:
  #   plugin-connector: runAsUser 1001 must be in [1000810000, 1000819999]
  # Naming them individually would silently break the moment the release is
  # named something else.
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:{{ .Values.prereqs.namespace }}

{{- if .Values.prereqs.privilegedForPluginBuild }}
---
# Plugin packages are built into container images IN-CLUSTER with Kaniko
# (plugin_connector.shaderImage = gcr.io/kaniko-project/executor).
# Kaniko needs more than anyuid on some clusters. Enable only if plugin
# builds fail with permission errors - it is a real privilege escalation.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dify-scc-privileged
  namespace: {{ .Values.prereqs.namespace }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: {{ .Values.prereqs.serviceAccountName }}
    namespace: {{ .Values.prereqs.namespace }}
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.prereqs.namespace }}
{{- end }}
{{- end }}
