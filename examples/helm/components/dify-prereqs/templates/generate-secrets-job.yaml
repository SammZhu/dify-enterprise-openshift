{{- if .Values.prereqs.enabled }}
---
# =============================================================================
# Credentials are generated ON THE CLUSTER and never stored in Git.
# =============================================================================
# This runs as an ArgoCD PreSync hook, before anything that consumes the
# secrets. It is idempotent: an existing secret is left alone, so re-syncing
# never rotates a password out from under a running database.
#
# To read a generated value:
#   oc get secret dify-postgresql -n <ns> -o jsonpath='{.data.password}' | base64 -d
#
# To set your own instead, create the secret before the first sync - this job
# will then leave it as-is.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: dify-generate-secrets
  namespace: {{ .Values.prereqs.namespace }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        demo.redhat.com/application: "dify-enterprise"
    spec:
      serviceAccountName: {{ .Values.prereqs.serviceAccountName }}
      restartPolicy: OnFailure
      containers:
        - name: generate
          image: {{ .Values.prereqs.cliImage }}
          env:
            - name: NS
              value: {{ .Values.prereqs.namespace }}
            - name: PG_DATABASE
              value: {{ .Values.prereqs.secrets.postgresqlDatabase | quote }}
            - name: PG_USERNAME
              value: {{ .Values.prereqs.secrets.postgresqlUsername | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.prereqs.secrets.minioBucket | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              rand() {
                head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32
              }

              ensure() {
                local name="$1"; shift
                if oc get secret "$name" -n "$NS" >/dev/null 2>&1; then
                  echo "secret/$name already exists - leaving it alone"
                else
                  oc create secret generic "$name" -n "$NS" "$@"
                  oc label secret "$name" -n "$NS" \
                    demo.redhat.com/application=dify-enterprise --overwrite >/dev/null
                  echo "secret/$name created with a generated credential"
                fi
              }

              ensure dify-postgresql \
                --from-literal=database="$PG_DATABASE" \
                --from-literal=username="$PG_USERNAME" \
                --from-literal=password="$(rand)"

              ensure dify-redis \
                --from-literal=password="$(rand)"

              ensure dify-qdrant \
                --from-literal=apiKey="$(rand)"

              ensure dify-minio \
                --from-literal=accessKey="$(rand)" \
                --from-literal=secretKey="$(rand)" \
                --from-literal=bucket="$MINIO_BUCKET"

              echo
              echo "All credentials present. None of them are in Git."
{{- end }}
