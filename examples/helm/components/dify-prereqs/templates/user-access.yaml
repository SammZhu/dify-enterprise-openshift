{{- if and .Values.prereqs.enabled .Values.prereqs.userAccess.enabled }}
{{- $n := int .Values.prereqs.userAccess.count }}
{{- if gt $n 0 }}
---
# Lets the RHDP-provisioned users work in this namespace.
#
# Without this they can log in and see nothing: the identity provider (RHBK)
# creates a User object on first login, but grants no project access. A
# RoleBinding may reference a user that does not exist yet - it takes effect
# when they first log in.
#
# "admin" here is the namespace-scoped ClusterRole, not cluster-admin: full
# control of this namespace, nothing outside it.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dify-user-access
  namespace: {{ .Values.prereqs.namespace }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.prereqs.userAccess.role }}
subjects:
{{- range $i := until $n }}
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: {{ printf "%s%d" $.Values.prereqs.userAccess.prefix (add1 $i) }}
{{- end }}
{{- end }}
{{- end }}
