{{- if and .Values.prereqs.enabled .Values.prereqs.userAccess.enabled .Values.prereqs.userAccess.allowRoleCreation }}
{{- $n := int .Values.prereqs.userAccess.count }}
{{- if gt $n 0 }}
---
# Lets the engineers install a chart that creates its own RBAC.
#
# Kubernetes refuses to let anyone grant permissions they do not themselves
# hold. The Dify chart creates Roles with verbs: ["*"], and the built-in
# `admin` ClusterRole enumerates specific verbs rather than "*", so installing
# it failed:
#
#   roles.rbac.authorization.k8s.io "dify-...-plugin-manager-role" is forbidden:
#   user "user1" is attempting to grant RBAC permissions not currently held:
#   {APIGroups:[""], Resources:["pods"], Verbs:["*"]} ...
#
# Holding "*" inside this namespace resolves it. That is broad here, but the
# users are already namespace admins - the practical delta is small, and it
# stays strictly namespace-scoped. Nothing cluster-wide is granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dify-namespace-full
  namespace: {{ .Values.prereqs.namespace }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dify-namespace-full
  namespace: {{ .Values.prereqs.namespace }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dify-namespace-full
subjects:
{{- range $i := until $n }}
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: {{ printf "%s%d" $.Values.prereqs.userAccess.prefix (add1 $i) }}
{{- end }}
{{- end }}
{{- end }}
