{{- if and .Values.prereqs.enabled .Values.prereqs.sccMatrix.enabled }}
---
# =============================================================================
# Per-component SCC, tighter than the namespace-wide anyuid baseline.
# =============================================================================
# plugin-connector pins runAsUser 1001 and never needs root. restricted-v2
# rejects it (the UID is outside the namespace range), which makes anyuid look
# like the answer - but nonroot-v2 admits it and grants strictly less.
#
# Binding nonroot-v2 by name is NOT enough. OpenShift picks an SCC by
# priority, and anyuid has priority 10 while nonroot-v2 has none. With anyuid
# bound namespace-wide, it wins every time and the tighter binding has no
# visible effect - the pod still comes up with scc=anyuid.
#
# So this is a copy of nonroot-v2 with a higher priority, bound only to the
# ServiceAccounts that should use it. Same constraints, just consulted first.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ .Values.prereqs.sccMatrix.nonrootSccName }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
  annotations:
    kubernetes.io/description: >-
      nonroot-v2 equivalent with a priority above anyuid, so components that
      never need root actually receive it instead of the broader anyuid.
priority: {{ .Values.prereqs.sccMatrix.nonrootPriority }}
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
readOnlyRootFilesystem: false
allowedCapabilities:
  - NET_BIND_SERVICE
requiredDropCapabilities:
  - ALL
runAsUser:
  type: MustRunAsNonRoot
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - csi
  - downwardAPI
  - emptyDir
  - ephemeral
  - image
  - persistentVolumeClaim
  - projected
  - secret
users: []
groups: []
---
# A custom SCC gets no system:openshift:scc:<name> ClusterRole of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.prereqs.sccMatrix.nonrootSccName }}-use
  labels:
    demo.redhat.com/application: "dify-enterprise"
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["{{ .Values.prereqs.sccMatrix.nonrootSccName }}"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dify-scc-nonroot-connector
  namespace: {{ .Values.prereqs.namespace }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.prereqs.sccMatrix.nonrootSccName }}-use
subjects:
{{- range .Values.prereqs.sccMatrix.nonrootServiceAccounts }}
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ $.Values.prereqs.namespace }}
{{- end }}
{{- end }}
