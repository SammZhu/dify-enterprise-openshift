{{- if and .Values.prereqs.enabled .Values.prereqs.imageRepoSecret.enabled }}
{{- $ns := .Values.prereqs.namespace }}
{{- $sa := .Values.prereqs.serviceAccountName }}
---
# =============================================================================
# image-repo-secret for the OpenShift internal registry, made on the cluster
# =============================================================================
# Dify's plugin_connector pushes each plugin it builds (Kaniko) to a registry,
# with credentials from a Secret whose name Dify fixes: image-repo-secret. For
# the internal registry that is a token for ServiceAccount {{ $sa }} - the one
# image-builder.yaml lets push. This Job mints it, so a new environment needs
# no manual step; scripts/create-image-repo-secret.sh does the same by hand and
# is still the way to point at an external registry.
#
# An existing Secret is left alone: re-syncing never rotates it, and a Secret
# made by hand for an external registry is never overwritten. The token is
# valid for a year; delete the Secret and re-sync to renew it.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dify-image-repo-secret
  namespace: {{ $ns }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dify-image-repo-secret
  namespace: {{ $ns }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [{{ $sa }}]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [image-repo-secret]
    verbs: [get]
  # create cannot be limited by name.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dify-image-repo-secret
  namespace: {{ $ns }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dify-image-repo-secret
subjects:
  - kind: ServiceAccount
    name: dify-image-repo-secret
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dify-image-repo-secret
  namespace: {{ $ns }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
  annotations:
    # After the ServiceAccounts and RBAC (wave 0), like generate-secrets-job.
    argocd.argoproj.io/sync-wave: "1"
    # A completed Job cannot be updated in place; see generate-secrets-job.yaml.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        demo.redhat.com/application: "dify-enterprise"
      annotations:
        # Every ServiceAccount in this namespace may use anyuid; this needs nothing of the kind.
        openshift.io/required-scc: restricted-v2
    spec:
      serviceAccountName: dify-image-repo-secret
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: create
          image: {{ .Values.prereqs.cliImage }}
          env:
            - {name: HOME, value: /tmp}
            - {name: NS, value: {{ $ns | quote }}}
            - {name: SA, value: {{ $sa | quote }}}
            - {name: REGISTRY, value: {{ .Values.prereqs.imageRepoSecret.registry | quote }}}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              if oc -n "$NS" get secret image-repo-secret >/dev/null 2>&1; then
                echo "image-repo-secret exists - left as it is"
                exit 0
              fi
              TOKEN="$(oc -n "$NS" create token "$SA" --duration=8760h)"
              [ -n "$TOKEN" ] || { echo "error: no token minted for $SA" >&2; exit 1; }
              # The internal registry accepts any user name with a valid SA token.
              AUTH="$(printf 'serviceaccount:%s' "$TOKEN" | base64 | tr -d '\n')"
              umask 077
              printf '{\n  "auths": {\n    "%s": {\n      "auth": "%s"\n    }\n  }\n}\n' "$REGISTRY" "$AUTH" > /tmp/config.json
              # Dify expects both keys.
              oc -n "$NS" create secret generic image-repo-secret \
                --from-file=.dockerconfigjson=/tmp/config.json \
                --from-file=config.json=/tmp/config.json \
                --type=kubernetes.io/dockerconfigjson
              rm -f /tmp/config.json
              echo "image-repo-secret created for $REGISTRY (token for $SA, valid one year)"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
{{- end }}
