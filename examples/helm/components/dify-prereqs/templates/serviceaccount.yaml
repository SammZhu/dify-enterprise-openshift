{{- if .Values.prereqs.enabled }}
---
# Dify Enterprise License activation requires a dedicated ServiceAccount
# plus Role / RoleBinding (Resources Checklist, enterprise-docs.dify.ai).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.prereqs.serviceAccountName }}
  namespace: {{ .Values.prereqs.namespace }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
{{- end }}
