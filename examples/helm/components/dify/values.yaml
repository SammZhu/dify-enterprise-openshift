# NOTE: no credentials in this file, by design. The rendered dify-values
# ConfigMap carries @@secret:<name>/<key>@@ placeholders which
# scripts/render-dify-values.sh resolves against cluster secrets at install time.
dify:
  enabled: true
  namespace: dify
  serviceAccountName: dify
  chartAvailable: false
  chartRepo: ""
  chartName: dify
  chartVersion: ""
  hosts:
    consolePrefix: dify-console
    apiPrefix: dify-api
    appPrefix: dify-app
    uploadPrefix: dify-upload
    enterprisePrefix: dify-enterprise
    triggerPrefix: dify-trigger
  pluginRegistry:
    imageRepoType: docker
    imageRepoPrefix: "image-registry.openshift-image-registry.svc:5000/dify"
    insecureImageRepo: true
    ecrRegion: ""
  marketplaceEnabled: true

deployer:
  domain: ""
  apiUrl: ""

litemaas:
  apiUrl: ""
  apiKey: ""
  model: ""

# Passed in by the App-of-Apps; these defaults only matter for standalone renders.
objectStorage:
  enabled: true
  claimName: dify-objectstorage
  bucketName: ""
  endpoint: http://s3.openshift-storage.svc:80
