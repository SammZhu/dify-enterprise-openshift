# NOTE: no credentials in this file, by design. The rendered dify-values
# ConfigMap carries @@secret:<name>/<key>@@ placeholders which
# scripts/render-dify-values.sh resolves against cluster secrets at install time.
dify:
  enabled: true
  otel:
    samplingRate: "1.0"
  namespace: dify
  serviceAccountName: dify
  # PostgreSQL user. Not a secret; must match prereqs.secrets.postgresqlUsername.
  dbUsername: dify
  chart:
    enabled: true
    repoURL: https://charts.openshift.io
    name: dify-enterprise
    version: 3.9.8
    releaseName: dify
  hosts:
    consolePrefix: dify-console
    apiPrefix: dify-api
    appPrefix: dify-app
    uploadPrefix: dify-upload
    enterprisePrefix: dify-enterprise
    triggerPrefix: dify-trigger
  pluginRegistry:
    imageRepoType: docker
    imageRepoPrefix: "image-registry.openshift-image-registry.svc:5000/dify"
    insecureImageRepo: true
    ecrRegion: ""
  marketplaceEnabled: true

# Passed in by the App-of-Apps: where the chart Application is created, and
# where the resolver Job's manifests come from.
argocd:
  namespace: openshift-gitops
  project: default
  appName: field-content-dify-chart
gitops:
  repoUrl: ""
  revision: main
  basePath: examples/helm
collaborationMode: true

deployer:
  domain: ""
  apiUrl: ""

litemaas:
  apiUrl: ""
  apiKey: ""
  model: ""

# Passed in by the App-of-Apps; these defaults only matter for standalone renders.
objectStorage:
  enabled: true
  claimName: dify-objectstorage
  bucketName: ""
  endpoint: http://s3.openshift-storage.svc:80
