{{- if .Values.dify.enabled }}
{{- $ns := .Values.dify.namespace }}
---
# =============================================================================
# Cluster-ready values for the COMMERCIAL dify-enterprise Helm chart.
# =============================================================================
# This ConfigMap is rendered against the live cluster (domain, in-cluster
# service names, generated credentials). Extract it and feed it to helm:
#
#   ./scripts/render-dify-values.sh {{ $ns }} > dify-values.yaml   # gitignored
#   helm install dify dify-enterprise --repo https://charts.openshift.io \
#     --version {{ .Values.dify.chart.version }} -n {{ $ns }} -f dify-values.yaml
#
# That is the manual path. With dify.chart.enabled, ArgoCD installs the chart
# with these same values (chart-application.yaml).
#
# This ConfigMap contains NO credentials. Every secret value is an
# @@secret:<name>/<key>@@ placeholder that render-dify-values.sh resolves
# against the cluster secrets at install time. A ConfigMap is plaintext in
# etcd and readable by anything with configmap access, so credentials must
# not live here.
#
# Every field below is taken from enterprise-docs.dify.ai for 3.9.x. Fields
# marked VERIFY could not be confirmed from the public docs - check them against
# `helm show values dify/dify` once you have chart access.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: dify-values
  namespace: {{ $ns }}
  labels:
    demo.redhat.com/application: "dify-enterprise"
data:
  dify-values.yaml: |
{{ include "dify.chartValues" . | indent 4 }}
{{- end }}
