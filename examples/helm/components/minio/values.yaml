# Credentials live in cluster-generated secrets, never here.
# See components/dify-prereqs/templates/generate-secrets-job.yaml
minio:
  enabled: true
  namespace: dify
  serviceAccountName: dify
  image: quay.io/minio/minio:latest
  mcImage: quay.io/minio/mc:latest
  bucket: dify
  storage:
    size: 50Gi
    storageClassName: ""
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1",    memory: "2Gi" }
